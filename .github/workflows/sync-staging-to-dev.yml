name: Sync Staging to Dev

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (check status without creating PR)'
        required: false
        default: 'false'
        type: boolean

  schedule:
    # Runs daily at 9 AM UTC on weekdays (Monday-Friday)
    # See: https://crontab.guru for help with cron syntax
    - cron: '0 9 * * 1-5'

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.CODEOWNER_PAT }}

      - name: Setup Git
        run: |
          git config user.name "sync-bot"
          git config user.email "sync-bot@users.noreply.github.com"

      - name: Check if sync needed
        id: diff-check
        run: |
          git fetch origin dev staging
          DIFF=$(git rev-list --count origin/dev..origin/staging)
          echo "commits_ahead=$DIFF" >> $GITHUB_OUTPUT
          echo "Staging is $DIFF commit(s) ahead of dev"
          if [ "$DIFF" -eq "0" ]; then
            echo "needs_sync=false" >> $GITHUB_OUTPUT
          else
            echo "needs_sync=true" >> $GITHUB_OUTPUT
          fi

      - name: Generate branch name
        if: steps.diff-check.outputs.needs_sync == 'true'
        id: branch-name
        run: |
          BRANCH_NAME="auto/staging-to-dev-${{ github.run_number }}"
          echo "branch=$BRANCH_NAME" >> $GITHUB_OUTPUT
          echo "Branch name: $BRANCH_NAME"

      - name: Check for existing PR
        if: steps.diff-check.outputs.needs_sync == 'true'
        id: existing-pr
        env:
          GH_TOKEN: ${{ secrets.CODEOWNER_PAT }}
        run: |
          # Check for any open PR targeting dev from an auto/staging-to-dev branch
          EXISTING=$(gh pr list --base dev --state open --json number,headRefName --jq '.[] | select(.headRefName | startswith("auto/staging-to-dev")) | .number' | head -1)
          if [ -n "$EXISTING" ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
            echo "pr_number=$EXISTING" >> $GITHUB_OUTPUT
            echo "PR #$EXISTING already exists for staging -> dev sync"
          else
            echo "exists=false" >> $GITHUB_OUTPUT
            echo "No existing sync PR found"
          fi

      - name: Check for conflicts
        if: steps.diff-check.outputs.needs_sync == 'true' && steps.existing-pr.outputs.exists == 'false'
        id: conflict-check
        run: |
          # Simulate merge to check for conflicts
          git checkout origin/dev -B temp-check
          if git merge origin/staging --no-commit --no-ff 2>/dev/null; then
            echo "has_conflicts=false" >> $GITHUB_OUTPUT
            echo "No merge conflicts detected."
          else
            echo "has_conflicts=true" >> $GITHUB_OUTPUT
            echo "Merge conflicts detected. PR will be created as draft."
          fi
          git merge --abort 2>/dev/null || true
          git checkout - 2>/dev/null || true

      - name: Exit if no sync needed
        if: steps.diff-check.outputs.needs_sync == 'false'
        run: |
          echo "Branch dev is already up to date with staging. No action required."

      - name: Exit if PR already exists
        if: steps.diff-check.outputs.needs_sync == 'true' && steps.existing-pr.outputs.exists == 'true'
        run: |
          echo "PR #${{ steps.existing-pr.outputs.pr_number }} already exists. No new PR created."

      - name: Exit if dry run
        if: steps.diff-check.outputs.needs_sync == 'true' && steps.existing-pr.outputs.exists == 'false' && inputs.dry_run == 'true'
        run: |
          echo "Dry run complete."
          echo "Commits to sync: ${{ steps.diff-check.outputs.commits_ahead }}"
          echo "Has conflicts: ${{ steps.conflict-check.outputs.has_conflicts }}"
          echo "Would create branch: ${{ steps.branch-name.outputs.branch }}"

      - name: Create branch from staging
        if: steps.diff-check.outputs.needs_sync == 'true' && steps.existing-pr.outputs.exists == 'false' && inputs.dry_run != 'true'
        run: |
          git checkout origin/staging -B ${{ steps.branch-name.outputs.branch }}
          git push origin ${{ steps.branch-name.outputs.branch }}
          echo "Created branch ${{ steps.branch-name.outputs.branch }} from staging"

      - name: Create Pull Request
        if: steps.diff-check.outputs.needs_sync == 'true' && steps.existing-pr.outputs.exists == 'false' && inputs.dry_run != 'true'
        env:
          GH_TOKEN: ${{ secrets.CODEOWNER_PAT }}
        run: |
          # Determine if PR should be draft
          if [ "${{ steps.conflict-check.outputs.has_conflicts }}" == "true" ]; then
            DRAFT_FLAG="--draft"
            CONFLICT_NOTE=$'\n> **Note: Merge conflicts detected. Please resolve conflicts in this branch before merging.**'
          else
            DRAFT_FLAG=""
            CONFLICT_NOTE=""
          fi

          # Create the PR
          gh pr create \
            --base dev \
            --head ${{ steps.branch-name.outputs.branch }} \
            --title "chore: sync staging to dev" \
            --body "#### Issue ID
          > AUTO-SYNC - Automated branch synchronization from staging to dev

          #### Description of Change Request
          > This PR synchronizes the staging branch into dev, bringing ${{ steps.diff-check.outputs.commits_ahead }} commit(s) from staging.${CONFLICT_NOTE}

          #### Reason for Change
          > Routine branch alignment to keep dev up-to-date with changes merged to staging.

          #### Scope of Change
          > All changes previously merged to staging that are not yet in dev.

          #### Impact / Systems Affected by Change
          > Development environment only. No production impact.

          #### Testing Validation
          > Standard CI checks. All tests must pass before merge.

          #### Breakout Procedure
          > Revert the merge commit or reset dev branch to previous state.

          ---
          This PR was created automatically by the sync workflow.
          Any team member can approve this PR." \
            --label "automated" \
            --label "sync" \
            $DRAFT_FLAG

          echo "Pull request created successfully."
